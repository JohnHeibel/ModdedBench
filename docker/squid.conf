# The agent may reach its model provider and nothing else: OpenAI for Codex, Anthropic for Claude Code (the API, and the
# hosts its login and token refresh use).
http_port 3128
acl provider dstdomain .openai.com .chatgpt.com
acl provider dstdomain api.anthropic.com platform.claude.com claude.ai
acl CONNECT method CONNECT
acl tls port 443
http_access deny CONNECT !tls
http_access allow provider
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
pid_filename none
