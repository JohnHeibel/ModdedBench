plugins {
    id 'base'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2' apply false
}

allprojects {
    group = 'dev.modbench'
    version = '0.1.0'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaCompile).matching { it.name in ['compileJava', 'compileTestJava', 'compileDevJava'] }.configureEach {
        options.release = 17
    }
    dependencies { testImplementation 'junit:junit:4.13.2' }
    tasks.withType(Test).configureEach { useJUnit() }
}

// Shipped jars: core (the only coremod), client, server and baritone.
configure([project(':core'), project(':client'), project(':server'), project(':baritone')]) {
    apply plugin: 'com.gtnewhorizons.retrofuturagradle'
    minecraft {
        mcVersion = '1.7.10'
        javaCompatibilityVersion = 17
        // Minecraft's own decompilation/recompilation still uses its Java 8 toolchain.
        jvmLanguageVersion = JavaLanguageVersion.of(8)
        username = 'ModbenchDev'
        userUUID = '3ba1bc1f-38db-3d85-86ff-07184d30b7a9'
    }
    tasks.named('jar', Jar) {
        archiveBaseName = 'modbench-' + project.name
        manifest { attributes('Implementation-Version': project.version) }
    }
    tasks.named('processResources') {
        inputs.property('version', project.version)
        filesMatching('mcmod.info') { expand(version: project.version) }
    }
}

project(':core') {
    def pack = new groovy.json.JsonSlurper().parse(rootProject.file('pack.lock.json'))
    dependencies { implementation project(':api') }
    tasks.named('processResources') {
        inputs.property('pack', pack.pack + ' ' + pack.version)
        filesMatching('modbench-pack.properties') { expand(pack: pack.pack + ' ' + pack.version) }
    }
    tasks.named('jar') {
        from project(':api').sourceSets.main.output
        manifest { attributes('FMLCorePlugin': 'dev.modbench.hooks.ClockPlugin', 'FMLCorePluginContainsFMLMod': 'true') }
    }
}
configure([project(':client'), project(':server')]) {
    dependencies {
        compileOnly project(':api')
        compileOnly project(':core')
        testImplementation project(':api')
        testImplementation project(':core')
    }
}
project(':server') {
    // Development fixtures compile on every build but only ship with -PdevFixtures.
    sourceSets {
        dev {
            java.srcDir 'src/dev/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }
    tasks.named('jar') { dependsOn 'devClasses'; if (project.hasProperty('devFixtures')) from sourceSets.dev.output }
    tasks.named('test') {
        dependsOn 'reobfJar'
        doFirst {
            systemProperty 'modbench.jar', tasks.reobfJar.outputs.files.singleFile.path
            systemProperty 'modbench.devFixtures', project.hasProperty('devFixtures') ? 'true' : 'false'
        }
    }
}
project(':baritone') {
    sourceSets.main.java.srcDir 'src/upstream/java'
    configurations { fastutilBundle { transitive = false } }
    dependencies {
        // Only the api: the compiler enforces the seam between Baritone and the core mod.
        compileOnly project(':api')
        // fastutil is not shipped by MC 1.7.10 or the pack, so the jar bundles it from a
        // detached configuration: resolving runtimeClasspath while wiring the jar task
        // would run RFG's deobf transform on the unbuilt api jar.
        compileOnly 'it.unimi.dsi:fastutil:8.5.15'
        testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
        fastutilBundle 'it.unimi.dsi:fastutil:8.5.15'
        testImplementation project(':api')
        // Allocating Minecraft for the settings persistence boundary resolves
        // its declared legacy LWJGL exception types even though no display is
        // created by the test.
        testRuntimeOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    }
    tasks.named('compileJava') { options.compilerArgs += ['-Xmaxerrs', '1000'] }
    tasks.named('test') {
        dependsOn ':api:jar'
        // Resolved at execution time: .asPath here would run RFG's deobf transform on
        // sibling project jars before they are built.
        doFirst {
            systemProperty 'modbench.test.classpath', sourceSets.test.runtimeClasspath.asPath
            systemProperty 'modbench.classes', sourceSets.main.output.classesDirs.asPath
        }
    }
    tasks.named('jar') {
        from({ configurations.fastutilBundle.collect { zipTree(it) } }) {
            include 'it/unimi/dsi/fastutil/**'
        }
        from(rootProject.file('LICENSE')) { into 'META-INF/licenses'; rename { 'Baritone-LGPL-3.0.txt' } }
        from(rootProject.file('mods/baritone/licenses')) { into 'META-INF/licenses' }
        from(rootProject.file('mods/baritone/UPSTREAM_SOURCES.json')) { into 'META-INF/modbench' }
    }
}
tasks.named('assemble') { dependsOn ':core:build', ':client:build', ':server:build', ':baritone:build' }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
